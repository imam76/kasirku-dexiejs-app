name: supabase-billing-staging

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "services/billing/**"
      - "src/onboarding/catalog.ts"
      - "src/onboarding/contract.ts"
      - "src/onboarding/legal.ts"
      - ".github/workflows/supabase-billing-staging.yml"

permissions:
  contents: read

concurrency:
  group: supabase-billing-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_BILLING_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_BILLING_DB_PASSWORD }}
      SUPABASE_WORKDIR: services/billing
      BILLING_BASE_URL: https://${{ vars.SUPABASE_BILLING_PROJECT_ID }}.supabase.co/functions/v1/billing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check billing Edge Function
        run: deno check services/billing/supabase/functions/billing/index.ts

      - name: Validate staging inputs
        shell: bash
        env:
          BILLING_ALLOWED_ORIGINS: ${{ secrets.BILLING_ALLOWED_ORIGINS }}
          MIDTRANS_MERCHANT_ID: ${{ secrets.MIDTRANS_SANDBOX_MERCHANT_ID }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_SANDBOX_CLIENT_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SANDBOX_SERVER_KEY }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD BILLING_ALLOWED_ORIGINS MIDTRANS_MERCHANT_ID MIDTRANS_CLIENT_KEY MIDTRANS_SERVER_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing staging value: $name"
              exit 1
            fi
          done
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_BILLING_PROJECT_ID is not a valid project ref"
            exit 1
          fi

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push --linked

      - name: Configure billing secrets
        shell: bash
        env:
          BILLING_ALLOWED_ORIGINS: ${{ secrets.BILLING_ALLOWED_ORIGINS }}
          MIDTRANS_MERCHANT_ID: ${{ secrets.MIDTRANS_SANDBOX_MERCHANT_ID }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_SANDBOX_CLIENT_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SANDBOX_SERVER_KEY }}
          BILLING_TAX_BPS: ${{ vars.BILLING_TAX_BPS || '0' }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/billing-staging.env"
          trap 'rm -f "$secrets_file"' EXIT
          cat > "$secrets_file" <<EOF
          BILLING_ALLOWED_ORIGINS=$BILLING_ALLOWED_ORIGINS
          MIDTRANS_ENVIRONMENT=sandbox
          MIDTRANS_MERCHANT_ID=$MIDTRANS_MERCHANT_ID
          MIDTRANS_CLIENT_KEY=$MIDTRANS_CLIENT_KEY
          MIDTRANS_SERVER_KEY=$MIDTRANS_SERVER_KEY
          MIDTRANS_NOTIFICATION_URL=$BILLING_BASE_URL/v1/midtrans/notifications
          MIDTRANS_FINISH_URL=$BILLING_BASE_URL/payment/finish
          BILLING_TAX_BPS=$BILLING_TAX_BPS
          EOF
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" --env-file "$secrets_file"

      - name: Deploy billing Edge Function
        run: supabase functions deploy billing --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$BILLING_BASE_URL/health"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
