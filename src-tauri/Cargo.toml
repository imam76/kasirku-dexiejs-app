[package]
name = "frayukti"
version = "1.0.70"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kasirku_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tauri-plugin-share = "2.0.5"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-safe-area-insets-css = "0.2.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
dotenvy = "0.15.7"
thiserror = "2.0.18"
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.2", features = ["serde", "v4"] }
quick-xml = "0.38.4"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "query"] }
rustls = "0.23.40"
webpki-roots = "1.0.7"
sha2 = "0.10.9"
hmac = "0.12.1"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.9.2"
url = "2.5.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-ios-webview-insets = "0.1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = { version = "4", default-features = false }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

# Printer thermal USB di Windows umumnya di-bind ke usbprint.sys dan hanya muncul
# sebagai printer spooler (port USB001), bukan sebagai COM port, sehingga tidak
# pernah terlihat oleh serialport. Bindings di bawah dipakai untuk menutup gap itu
# (winspool RAW) sekaligus menemukan COM port Bluetooth SPP yang sedang disconnect.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
] }
